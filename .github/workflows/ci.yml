name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows only for now: that is the platform the tool has been tested on. The code itself uses no
    # Windows-only API, so a macOS job is a contribution rather than a rewrite - see CONTRIBUTING.md.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: build
        # The solution names all three projects, so one build covers the CLI and both checks. The check
        # executables below are still invoked by path: what is run is what was just built.
        run: dotnet build DoricoUse.slnx -c Release --nologo

      - name: run the checks
        # Both checks exit non-zero on a failure. The fixture committed at tests/corpus/fixture.dorico always
        # runs, so the decoder is exercised on every push; the checks that need the maintainer's own scores
        # report `skip` and exit 0 instead, because those files are deliberately not in the repository
        # (see NOTICE). See CONTRIBUTING.md to point them at your own.
        run: |
          ./tests/ProjectFileCheck/bin/Release/net10.0/project-file-check.exe
          ./tests/VocabularyCheck/bin/Release/net10.0/vocabulary-check.exe

      - name: publish (Native AOT, win-x64)
        run: dotnet publish src/DoricoUse.Cli/DoricoUse.Cli.csproj -c Release -r win-x64 --nologo

      - name: what was published
        shell: pwsh
        run: |
          Get-Item src/DoricoUse.Cli/bin/Release/net10.0/win-x64/publish/dorico-use.exe |
            Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: dorico-use-win-x64
          path: |
            src/DoricoUse.Cli/bin/Release/net10.0/win-x64/publish/dorico-use.exe
            README.md
            LICENSE
            NOTICE
            CHANGELOG.md
          if-no-files-found: error
